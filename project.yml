name: Kalli
options:
  bundleIdPrefix: com.kalli
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.21.2"
    CURRENT_PROJECT_VERSION: "6"

# Genau EINE direkte Abhaengigkeit, null transitive.
#
# `exactVersion` statt `from:`: Bei einer Anwendung entscheidet sonst der
# Auflösungszeitpunkt, welche Updater-Version ausgeliefert wird — und ein
# Updater ist die falsche Stelle fuer Zufall. `Package.resolved` ist
# versioniert, damit der Build reproduzierbar bleibt.
# Begruendung vollstaendig: docs/AUTO-UPDATE-DESIGN.md
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Kalli:
    type: application
    platform: macOS
    sources:
      - path: Kalli
    # Doku liegt als Datei im Bundle, nicht als Swift-String. Damit kann die
    # angezeigte Hilfe nicht aelter sein als der Build.
    resources:
      - path: Kalli/Resources/HILFE.md
      - path: Kalli/Resources/RECHTLICHES.md
      - path: Kalli/Resources/THIRD-PARTY-LICENSES.md
      - path: Kalli/Resources/CHANGELOG.md
      - path: Kalli/Resources/AppIcon.icns
      # Ton der App-Familie (2026-11-26): „Ton zum Hinweis“ beim Vollbild-Hinweis, ab Werk aus
      - path: Kalli/Resources/kalli.caf
      # Ton der Zeiterfassung bei Start/Stopp (0.21.0, aus MacStd), „Ton“ im Reiter Zeit, ab Werk aus
      - path: Kalli/Resources/zeit.caf
      # Schrift der App-Familie (ab 0.6.0), SIL OFL 1.1 — Lizenztext in THIRD-PARTY-LICENSES.md
      - path: Kalli/Resources/PlusJakartaSans-Variable.ttf
    dependencies:
      - package: Sparkle
        product: Sparkle
      # Widget „Tagesblatt“ (2026-11-26), landet in Kalli.app/Contents/PlugIns.
      - target: KalliWidget
    settings:
      base:
        INFOPLIST_FILE: Kalli/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kalli.app
        CODE_SIGN_ENTITLEMENTS: Kalli/Resources/Kalli.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # Widget „Tagesblatt“ (2026-11-26): das Papierblatt als Schreibtisch-Widget, nur anzeigend.
  # Sandbox ist Pflicht für WidgetKit (Kalli selbst läuft ohne). Liest Kalender und
  # Erinnerungen selbst per EventKit; die Erlaubnis erteilt der Nutzer der App Kalli.
  # Geteilt mit der App: Modelle und Monatsraster (DeskPad). Aussehen wie Punkti (Kalli/UI/PunktiStyle.swift, PunktiDayParts.swift).
  KalliWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: KalliWidget
        excludes:
          - Info.plist
          - KalliWidget-macOS.entitlements
      - path: Kalli/Core/Models.swift
      - path: Kalli/Core/DeskPad.swift
      - path: Kalli/Core/AgendaGroupKind.swift
      - path: Kalli/UI/PunktiStyle.swift
      - path: Kalli/UI/PunktiDayParts.swift
    info:
      path: KalliWidget/Info.plist
      properties:
        CFBundleDisplayName: Kalli
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: "Das Kalli-Widget zeigt deine Termine von heute. Es ändert nichts."
        NSRemindersFullAccessUsageDescription: "Das Kalli-Widget zeigt deine Aufgaben von heute. Es ändert nichts."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalli.app.widget
        CODE_SIGN_ENTITLEMENTS: KalliWidget/KalliWidget-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # Prüft ausschliesslich REINE Entscheidungslogik — keine EventKit-Zugriffe,
  # keine Berechtigungen, keine Uhr. Alle geprüften Funktionen bekommen `now`
  # übergeben; ein Test, der von der Systemuhr abhängt, schlägt irgendwann
  # nachts fehl und wird dann ignoriert statt gelesen.
  #
  # OHNE Host-App (2026-10-28): keine Abhängigkeit auf das Ziel Kalli, also kein
  # TEST_HOST — ein Testlauf startet keine zweite Kalli neben der installierten.
  # Die geprüften Dateien werden direkt mitkompiliert. Was hier fehlt, kennt der
  # Compiler nicht: Updater.swift (Sparkle) und KalliApp.swift (@main) bleiben
  # draußen; die UI-Dateien stehen nur wegen Logik darin (AppearanceMode,
  # MonthRaster, FullScreenAlertView.status) bzw. deren Abhängigkeiten.
  KalliTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KalliTests
      - path: Kalli/Core
        excludes:
          - Updater.swift
      # Zeiterfassung (0.21.0): Modell, Speicher, Logik, Export — ohne UI.
      - path: Kalli/Zeit
      - path: Kalli/App/MenuBarLabel.swift
      - path: Kalli/App/MenuBarIcon.swift
      - path: Kalli/App/CalendarToday.swift
      - path: Kalli/UI/Theme.swift
      - path: Kalli/UI/FamilyTheme.swift
      # Glas-Sprache (Knippi 0.7.0): GlassEffects und MonthGrid nutzen die Akzent-Pille des Kits.
      - path: Kalli/UI/FamilyGlassKit.swift
      - path: Kalli/UI/GlassBackground.swift
      - path: Kalli/UI/GlassEffects.swift
      - path: Kalli/UI/MonthGrid.swift
      - path: Kalli/UI/FullScreenAlertWindow.swift
      # TaskDigest (Core) hält sein Fenster; die Ansicht braucht `movesWindow`.
      - path: Kalli/UI/TaskDigestWindow.swift
      - path: Kalli/UI/WindowDragArea.swift
      # Befehlskanal der Bild-Testkopie (docs/SECURE-DESIGN.md K1): nur das reine Parsen, kein Socket.
      - path: Kalli/Debug/DebugCommand.swift
      - path: Kalli/Debug/SelfTestResult.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kalli.app.tests
