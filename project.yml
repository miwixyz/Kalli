name: Kalli
options:
  bundleIdPrefix: com.kalli
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Kalli:
    type: application
    platform: macOS
    sources:
      - path: Kalli
    # Doku liegt als Datei im Bundle, nicht als Swift-String. Damit kann die
    # angezeigte Hilfe nicht aelter sein als der Build.
    resources:
      - path: Kalli/Resources/HILFE.md
      - path: Kalli/Resources/RECHTLICHES.md
      - path: Kalli/Resources/CHANGELOG.md
      - path: Kalli/Resources/AppIcon.icns
    settings:
      base:
        INFOPLIST_FILE: Kalli/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kalli.app
        CODE_SIGN_ENTITLEMENTS: Kalli/Resources/Kalli.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
