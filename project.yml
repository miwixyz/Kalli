name: MacCal
options:
  bundleIdPrefix: com.maccal
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacCal:
    type: application
    platform: macOS
    sources:
      - path: MacCal
    settings:
      base:
        INFOPLIST_FILE: MacCal/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.maccal.app
        CODE_SIGN_ENTITLEMENTS: MacCal/Resources/MacCal.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
