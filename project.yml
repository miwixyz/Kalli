name: Kalli
options:
  bundleIdPrefix: com.kalli
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "6"

# Genau EINE direkte Abhaengigkeit, null transitive.
#
# `exactVersion` statt `from:`: Bei einer Anwendung entscheidet sonst der
# Auflösungszeitpunkt, welche Updater-Version ausgeliefert wird — und ein
# Updater ist die falsche Stelle fuer Zufall. `Package.resolved` ist
# versioniert, damit der Build reproduzierbar bleibt.
# Begruendung vollstaendig: docs/AUTO-UPDATE-DESIGN.md
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Kalli:
    type: application
    platform: macOS
    sources:
      - path: Kalli
    # Doku liegt als Datei im Bundle, nicht als Swift-String. Damit kann die
    # angezeigte Hilfe nicht aelter sein als der Build.
    resources:
      - path: Kalli/Resources/HILFE.md
      - path: Kalli/Resources/RECHTLICHES.md
      - path: Kalli/Resources/THIRD-PARTY-LICENSES.md
      - path: Kalli/Resources/CHANGELOG.md
      - path: Kalli/Resources/AppIcon.icns
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Kalli/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kalli.app
        CODE_SIGN_ENTITLEMENTS: Kalli/Resources/Kalli.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # Prüft ausschliesslich REINE Entscheidungslogik — keine EventKit-Zugriffe,
  # keine Berechtigungen, keine Uhr. Alle geprüften Funktionen bekommen `now`
  # übergeben; ein Test, der von der Systemuhr abhängt, schlägt irgendwann
  # nachts fehl und wird dann ignoriert statt gelesen.
  KalliTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KalliTests
    dependencies:
      - target: Kalli
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kalli.app.tests
